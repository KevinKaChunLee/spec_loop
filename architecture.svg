<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ah-grey" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="ah-green" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#17a673"/></marker>
    <marker id="ah-orange" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e07b39"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1170" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="48" font-size="30" font-weight="700" fill="#0f172a">spec_loop &#8212; Architecture</text>
  <text x="42" y="74" font-size="13.5" fill="#64748b">Oracle / student OpenSpec loop on the Cursor CLI &#183; GLM 5.3 Max oracle, judge and synthesizer &#183; GLM 5.3 High student &#183; HMOS &#8594; liteOS call_manager</text>

  <!-- ============ 1. SHARED INPUTS ============ -->
  <rect x="20" y="94" width="1200" height="126" rx="14" fill="#f5f8ff" stroke="#c7d7f5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="44" cy="120" r="11" fill="#334155"/><text x="44" y="125" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="64" y="125" font-size="15" font-weight="700" fill="#334155">SHARED INPUTS &#8212; frozen per run at base_sha, identical for every agent</text>

  <rect x="40" y="138" width="188" height="62" rx="8" fill="#ffffff" stroke="#bcd0f0" stroke-width="1.5"/>
  <text x="56" y="165" font-size="14" font-weight="700" fill="#0f172a">AGENTS.md</text>
  <text x="56" y="185" font-size="11.5" fill="#64748b">scope &#183; macros &#183; deps</text>

  <rect x="238" y="138" width="188" height="62" rx="8" fill="#ffffff" stroke="#bcd0f0" stroke-width="1.5"/>
  <text x="254" y="165" font-size="13.5" font-weight="700" fill="#0f172a">openspec/config.yaml</text>
  <text x="254" y="185" font-size="11.5" fill="#64748b">context &#183; artifact rules</text>

  <rect x="436" y="138" width="188" height="62" rx="8" fill="#ffffff" stroke="#bcd0f0" stroke-width="1.5"/>
  <text x="452" y="165" font-size="14" font-weight="700" fill="#0f172a">HMOS baseline</text>
  <text x="452" y="185" font-size="11.5" fill="#64748b">telephony_call_manager/</text>

  <rect x="634" y="138" width="188" height="62" rx="8" fill="#ffffff" stroke="#bcd0f0" stroke-width="1.5"/>
  <text x="650" y="165" font-size="14" font-weight="700" fill="#0f172a">.cursor/skills</text>
  <text x="650" y="185" font-size="11.5" fill="#64748b">openspec-propose &amp; co.</text>

  <rect x="832" y="138" width="188" height="62" rx="8" fill="#ffffff" stroke="#bcd0f0" stroke-width="1.5"/>
  <text x="848" y="165" font-size="14" font-weight="700" fill="#0f172a">prompts/task.md</text>
  <text x="848" y="185" font-size="11.5" fill="#64748b">same task for both</text>

  <rect x="1036" y="138" width="164" height="62" rx="8" fill="#fff7ec" stroke="#e0913a" stroke-width="1.5"/>
  <text x="1052" y="165" font-size="14" font-weight="700" fill="#0f172a">inputs.lock.json</text>
  <text x="1052" y="185" font-size="11.5" fill="#64748b">hashes &#183; CLI versions</text>

  <!-- inputs -> agent runs -->
  <polyline points="620,220 620,246" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="628" y="225" width="134" height="17" fill="#ffffff"/><text x="634" y="238" font-size="12" fill="#2563eb" font-style="italic">git archive base_sha</text>

  <!-- ============ 2. ISOLATED AGENT RUNS ============ -->
  <rect x="20" y="248" width="1200" height="140" rx="14" fill="#eefaf4" stroke="#a7e0c8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="44" cy="274" r="11" fill="#17a673"/><text x="44" y="279" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="64" y="279" font-size="15" font-weight="700" fill="#0f7a54">ISOLATED AGENT RUNS &#8212; every oracle, student, judge and synthesizer call</text>

  <rect x="40" y="294" width="270" height="62" rx="10" fill="#ffffff" stroke="#8fd6b8" stroke-width="1.5"/>
  <text x="56" y="321" font-size="15" font-weight="700" fill="#0f172a">workspace.py</text>
  <text x="56" y="342" font-size="11.5" fill="#64748b">fresh snapshot &#183; no history &#183; 1 commit</text>

  <rect x="330" y="294" width="270" height="62" rx="10" fill="#ffffff" stroke="#8fd6b8" stroke-width="1.5"/>
  <text x="346" y="321" font-size="15" font-weight="700" fill="#0f172a">runner.py</text>
  <text x="346" y="342" font-size="11.5" fill="#64748b">agent -p &#183; stream-json &#183; retry / resume</text>
  <polyline points="310,325 328,325" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-grey)"/>

  <rect x="620" y="294" width="270" height="62" rx="10" fill="#ffffff" stroke="#8fd6b8" stroke-width="1.5"/>
  <text x="636" y="321" font-size="15" font-weight="700" fill="#0f172a">guards.py</text>
  <text x="636" y="342" font-size="11.5" fill="#64748b">only openspec/ &#183; validate &#183; leak check</text>
  <polyline points="600,325 618,325" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-grey)"/>

  <rect x="910" y="294" width="290" height="62" rx="10" fill="#ffffff" stroke="#8fd6b8" stroke-width="1.5"/>
  <text x="926" y="321" font-size="15" font-weight="700" fill="#0f172a">render_traj &#183; trajviz_export</text>
  <text x="926" y="342" font-size="11.5" fill="#64748b">trajectory.md &#183; stats &#183; TrajViz JSON</text>
  <polyline points="890,325 908,325" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-grey)"/>

  <text x="40" y="377" font-size="11.5" fill="#64748b">scratch: spec-loop-ws/&lt;run&gt;/&lt;stage&gt;/   &#8594;   results copied to runs/&lt;run&gt;/&lt;stage&gt;/</text>

  <!-- agent runs -> oracle -->
  <polyline points="165,388 165,414" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="173" y="393" width="122" height="17" fill="#ffffff"/><text x="179" y="406" font-size="12" fill="#2563eb" font-style="italic">own workspace</text>

  <!-- ============ 3. ORACLE ============ -->
  <rect x="20" y="416" width="1200" height="160" rx="14" fill="#f6f0ff" stroke="#d6c4f5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="44" cy="442" r="11" fill="#8b5cf6"/><text x="44" y="447" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="64" y="447" font-size="15" font-weight="700" fill="#6b3fd4">ORACLE &#8212; once per run, then frozen</text>

  <!-- revise loop -->
  <polyline points="465,490 465,474 165,474 165,488" fill="none" stroke="#e07b39" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-orange)"/>
  <rect x="226" y="466" width="178" height="16" fill="#f6f0ff"/><text x="315" y="478" font-size="11.5" fill="#c25f1f" font-style="italic" text-anchor="middle">--revise resumes the session</text>

  <rect x="40" y="490" width="250" height="62" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="56" y="517" font-size="15" font-weight="700" fill="#0f172a">Oracle</text>
  <text x="56" y="538" font-size="11.5" fill="#64748b">GLM 5.3 Max &#183; baseline + change</text>

  <rect x="330" y="490" width="270" height="62" rx="10" fill="#fff7ec" stroke="#e0913a" stroke-width="1.5"/>
  <text x="346" y="517" font-size="15" font-weight="700" fill="#0f172a">Human review</text>
  <text x="346" y="538" font-size="11.5" fill="#64748b">edit runs/&lt;run&gt;/oracle/spec/</text>
  <polyline points="290,521 328,521" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="640" y="490" width="250" height="62" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="656" y="517" font-size="15" font-weight="700" fill="#0f172a">freeze</text>
  <text x="656" y="538" font-size="11.5" fill="#64748b">MANIFEST.sha256 &#183; read-only</text>
  <polyline points="600,521 638,521" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="930" y="490" width="270" height="62" rx="12" fill="#dbe8ff" stroke="#3b6fe0" stroke-width="2"/>
  <text x="1065" y="516" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Frozen reference spec</text>
  <text x="1065" y="537" font-size="11.5" fill="#3b5b9e" text-anchor="middle">re-verified before every stage</text>
  <polyline points="890,521 928,521" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- ============ 4. TEACHING LOOP ============ -->
  <rect x="20" y="606" width="1200" height="318" rx="14" fill="#eef6ff" stroke="#bcd0f0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="44" cy="632" r="11" fill="#1d4ed8"/><text x="44" y="637" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="64" y="637" font-size="15" font-weight="700" fill="#1d4ed8">TEACHING LOOP &#8212; iteration k = 0 &#8230; N  (loop.py iterate)</text>

  <!-- reference -> judge and synthesizer (never the student); drawn after band 4 so its fill does not hide it -->
  <polyline points="1065,552 1065,640 755,640 755,666" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>
  <polyline points="1065,640 1065,666" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="860" y="583" width="198" height="17" fill="#ffffff"/><text x="959" y="596" font-size="12" fill="#2563eb" font-style="italic" text-anchor="middle">reference (judge + synthesizer)</text>

  <!-- Student (blind) -->
  <rect x="40" y="668" width="250" height="78" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="694" font-size="15" font-weight="700" fill="#0f172a">Student</text>
  <text x="56" y="714" font-size="11.5" fill="#64748b">GLM 5.3 High</text>
  <text x="56" y="731" font-size="11.5" fill="#64748b">task.md + playbook_k</text>
  <rect x="232" y="676" width="48" height="18" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="256" y="689" font-size="11" fill="#dc2626" text-anchor="middle">blind</text>

  <rect x="330" y="668" width="250" height="78" rx="10" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="346" y="694" font-size="15" font-weight="700" fill="#0f172a">Student outputs</text>
  <text x="346" y="714" font-size="11.5" fill="#64748b">spec &#183; trajectory &#183; stats</text>
  <text x="346" y="731" font-size="11.5" fill="#64748b">guards &#183; metrics &#183; TrajViz</text>
  <polyline points="290,707 328,707" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="620" y="668" width="270" height="78" rx="10" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="636" y="694" font-size="15" font-weight="700" fill="#0f172a">Judge (oracle model)</text>
  <text x="636" y="714" font-size="11.5" fill="#64748b">rubric.md &#183; metrics.md</text>
  <text x="636" y="731" font-size="11.5" fill="#64748b">&#8594; score.json &#183; report.md</text>
  <polyline points="580,707 618,707" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="930" y="668" width="270" height="78" rx="10" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="946" y="694" font-size="15" font-weight="700" fill="#0f172a">Synthesizer (oracle model)</text>
  <text x="946" y="714" font-size="11.5" fill="#64748b">gap report &#183; trajectory</text>
  <text x="946" y="731" font-size="11.5" fill="#64748b">TrajViz views &#183; playbook_rules</text>
  <polyline points="890,707 928,707" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- judge -> scores -->
  <polyline points="700,746 700,774 455,774 455,798" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-grey)"/>
  <rect x="556" y="766" width="44" height="16" fill="#eef6ff"/><text x="578" y="778" font-size="11.5" fill="#64748b" font-style="italic" text-anchor="middle">total</text>

  <!-- synthesizer -> checker, reject loop -->
  <polyline points="1040,746 1040,798" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-grey)"/>
  <polyline points="1150,800 1150,748" fill="none" stroke="#e07b39" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-orange)"/>
  <rect x="1050" y="764" width="92" height="16" fill="#eef6ff"/><text x="1096" y="776" font-size="11.5" fill="#c25f1f" font-style="italic" text-anchor="middle">&#8804;2 rewrites</text>

  <rect x="330" y="800" width="250" height="62" rx="10" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="346" y="827" font-size="15" font-weight="700" fill="#0f172a">scores.csv</text>
  <text x="346" y="848" font-size="11.5" fill="#64748b">mean per iteration &#183; plateau stop</text>

  <rect x="620" y="800" width="270" height="62" rx="10" fill="#eefaf4" stroke="#17a673" stroke-width="1.5"/>
  <text x="636" y="827" font-size="15" font-weight="700" fill="#0f172a">Playbook for k+1</text>
  <text x="636" y="848" font-size="11.5" fill="#64748b">playbook.md &#183; changelog.md</text>

  <rect x="930" y="800" width="270" height="62" rx="10" fill="#ffffff" stroke="#8fd6b8" stroke-width="1.5"/>
  <text x="946" y="827" font-size="15" font-weight="700" fill="#0f172a">Playbook checker</text>
  <text x="946" y="848" font-size="11.5" fill="#64748b">no copied text &#183; &#8804;300 lines</text>
  <polyline points="930,831 892,831" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="911" y="824" font-size="11" fill="#2563eb" font-style="italic" text-anchor="middle">pass</text>

  <!-- playbook -> next student -->
  <polyline points="755,862 755,892 165,892 165,748" fill="none" stroke="#17a673" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-green)"/>
  <rect x="330" y="884" width="290" height="17" fill="#eef6ff"/><text x="475" y="897" font-size="12" fill="#17a673" font-style="italic" text-anchor="middle">next iteration &#183; appended to the student prompt</text>

  <!-- loop -> outputs -->
  <polyline points="620,924 620,950" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="628" y="929" width="140" height="17" fill="#ffffff"/><text x="634" y="942" font-size="12" fill="#2563eb" font-style="italic">copied to runs/&lt;run&gt;/</text>

  <!-- ============ 5. OUTPUTS & ANALYSIS ============ -->
  <rect x="20" y="952" width="1200" height="150" rx="14" fill="#fff4ea" stroke="#f0c79b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="44" cy="978" r="11" fill="#e07b39"/><text x="44" y="983" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="64" y="983" font-size="15" font-weight="700" fill="#c25f1f">OUTPUTS &amp; ANALYSIS</text>

  <rect x="40" y="996" width="380" height="86" rx="10" fill="#fffaf4" stroke="#e0913a" stroke-width="1.5"/>
  <text x="56" y="1022" font-size="15" font-weight="700" fill="#0f172a">runs/&lt;run&gt;/</text>
  <text x="56" y="1042" font-size="11.5" fill="#64748b">committed: specs &#183; scores &#183; reports &#183; playbooks</text>
  <text x="56" y="1060" font-size="11.5" fill="#64748b">local only: raw jsonl &#183; transcripts &#183; TrajViz files</text>

  <rect x="440" y="996" width="220" height="86" rx="10" fill="#fffaf4" stroke="#e0913a" stroke-width="1.5"/>
  <text x="456" y="1022" font-size="15" font-weight="700" fill="#0f172a">loop.py status</text>
  <text x="456" y="1042" font-size="11.5" fill="#64748b">scores per iteration</text>
  <text x="456" y="1060" font-size="11.5" fill="#64748b">and per sample</text>

  <rect x="680" y="996" width="250" height="86" rx="10" fill="#fffaf4" stroke="#e0913a" stroke-width="1.5"/>
  <text x="696" y="1022" font-size="15" font-weight="700" fill="#0f172a">TrajViz export</text>
  <text x="696" y="1042" font-size="11.5" fill="#64748b">&lt;stage&gt;/trajviz/*.trajviz.json</text>
  <text x="696" y="1060" font-size="11.5" fill="#64748b">views/ &#183; HTML report</text>

  <rect x="950" y="996" width="250" height="86" rx="10" fill="#fffaf4" stroke="#e0913a" stroke-width="1.5"/>
  <text x="966" y="1022" font-size="15" font-weight="700" fill="#0f172a">TrajViz dashboard</text>
  <text x="966" y="1042" font-size="11.5" fill="#64748b">agent-trajviz &#183; upload the JSON</text>
  <text x="966" y="1060" font-size="11.5" fill="#64748b">health &#183; issues &#183; patterns</text>
  <polyline points="930,1039 948,1039" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- Legend -->
  <g font-size="12.5" fill="#334155">
    <polyline points="40,1140 74,1140" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="86" y="1144">Artifact flow</text>
    <polyline points="200,1140 234,1140" fill="none" stroke="#17a673" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ah-green)"/><text x="246" y="1144">Playbook feedback</text>
    <polyline points="396,1140 430,1140" fill="none" stroke="#e07b39" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ah-orange)"/><text x="442" y="1144">Human review / retry loop</text>
    <polyline points="640,1140 674,1140" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah-grey)"/><text x="686" y="1144">Internal step</text>
    <rect x="800" y="1132" width="34" height="16" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/><text x="846" y="1144">Blind: never sees the reference or rubric</text>
  </g>
</svg>
